# Fork-only: copy upstream's main-built native addons into this fork's cache.
#
# Upstream CI (ci.yml, job `native_addons`) never builds the native addons on
# pull requests. A PR restores the linux-x64 addon pair that a `main` push run
# saved to actions/cache under `natives-linux-x64-v1-<hash of native inputs>`
# (exact key, else the newest entry with that prefix), and without any entry it
# falls back to the latest npm release. In upstream that `main` run executes on
# `vmon-large/from=omp-ci` self-hosted runners. This fork has no vmon runner
# and its own `main` is not synced with upstream, so it never saves an entry,
# and every fork PR tests against the npm release addons. A PR that needs
# merged but unreleased native code then fails.
#
# Upstream `main` runs also upload the same pair as the public artifact
# `natives-linux-x64` (kept 1 day). This workflow copies the newest such
# artifact into this fork's cache on `refs/heads/main`, under the key that
# ci.yml computes for that artifact's commit. Entries saved on the default
# branch are readable by every PR. Nothing is built here, so a run takes about
# a minute on a GitHub-hosted runner. Same idea as upstream's
# bun-cache-warm.yml: one hosted producer of a `main` cache entry for PRs.
#
# Keep this file on the fork's `main`: schedules run only on the default
# branch. Sync `main` with upstream by merge ("Sync fork" > "Update branch");
# a forced sync deletes this file.
name: Fork native addon cache

on:
   schedule:
      # Hourly. When the newest upstream artifact is already cached, the run
      # stops after the cache probe.
      - cron: "17 * * * *"
   workflow_dispatch:
   push:
      branches: [main]
      paths:
         - ".github/workflows/fork-natives.yml"
   # Validation only: finds, downloads and smoke-tests the artifact, never
   # saves (an entry saved on a PR ref is readable by that ref alone).
   pull_request:
      branches: [main]
      paths:
         - ".github/workflows/fork-natives.yml"

permissions:
   contents: read

concurrency:
   group: fork-natives-${{ github.ref }}
   cancel-in-progress: false

env:
   UPSTREAM_REPO: can1357/oh-my-pi
   ARTIFACT_NAME: natives-linux-x64
   # Must equal the `natives-key` step of upstream ci.yml; the contract check
   # below compares it.
   NATIVES_KEY_PREFIX: natives-linux-x64-v1-
   CACHE_RESTORE_PIN: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830

jobs:
   # Upstream `main` push runs only, newest first. The artifact exists only
   # when that run's native build passed, so a broken upstream build is
   # skipped instead of copied. No artifact in the window is not an error:
   # the cache keeps the newest good entry, and the seed job is skipped.
   find:
      name: Find newest upstream native addon artifact
      # Upstream has its own `main` build; run only in forks.
      if: github.repository_owner != 'can1357'
      runs-on: ubuntu-22.04
      timeout-minutes: 10
      outputs:
         found: ${{ steps.find.outputs.found }}
         run-id: ${{ steps.find.outputs.run-id }}
         head-sha: ${{ steps.find.outputs.head-sha }}
      steps:
         - name: Find newest upstream native addon artifact
           id: find
           shell: bash
           env:
              GH_TOKEN: ${{ github.token }}
           run: |
              set -euo pipefail
              runs=$(gh api "repos/$UPSTREAM_REPO/actions/workflows/ci.yml/runs?branch=main&event=push&per_page=30" \
                  --jq '.workflow_runs[] | "\(.id) \(.head_sha)"')
              while read -r run_id head_sha; do
                [ -n "$run_id" ] || continue
                found=$(gh api "repos/$UPSTREAM_REPO/actions/runs/$run_id/artifacts?name=$ARTIFACT_NAME" \
                    --jq '[.artifacts[] | select(.expired == false)] | length')
                if [ "$found" -gt 0 ]; then
                  echo "Using artifact $ARTIFACT_NAME from $UPSTREAM_REPO run $run_id (commit $head_sha)."
                  {
                    echo "found=true"
                    echo "run-id=$run_id"
                    echo "head-sha=$head_sha"
                  } >> "$GITHUB_OUTPUT"
                  exit 0
                fi
              done <<< "$runs"
              echo "::warning title=Native addon cache::None of the newest 30 upstream main runs has an unexpired $ARTIFACT_NAME artifact; the cache keeps its current entries."
              echo "found=false" >> "$GITHUB_OUTPUT"

   seed:
      name: Copy upstream linux-x64 native addons to the cache
      needs: find
      if: needs.find.outputs.found == 'true'
      runs-on: ubuntu-22.04
      timeout-minutes: 30
      outputs:
         saved: ${{ steps.save.outcome == 'success' }}
      steps:
         - name: Check out the artifact's upstream commit
           uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
           with:
              repository: ${{ env.UPSTREAM_REPO }}
              ref: ${{ needs.find.outputs.head-sha }}
              persist-credentials: false

         # A changed key prefix or cache path makes every fork PR miss the
         # entry and fall back to npm without an error, so it fails here. A
         # moved action pin usually keeps the cache version compatible, so it
         # only warns. A changed hashFiles() list only loses exact-key hits;
         # PR CI shows that as "Native addons not source-matched".
         - name: Check upstream cache contract
           shell: bash
           run: |
              set -euo pipefail
              ci=.github/workflows/ci.yml
              fail=0
              for needle in "prefix=$NATIVES_KEY_PREFIX" "path: ci-natives"; do
                if ! grep -qF -- "$needle" "$ci"; then
                  echo "::error::$ci no longer contains '$needle'. Update fork-natives.yml to match upstream."
                  fail=1
                fi
              done
              if ! grep -qF -- "$CACHE_RESTORE_PIN" "$ci"; then
                echo "::warning::$ci no longer uses $CACHE_RESTORE_PIN. Update the actions/cache pins in fork-natives.yml."
              fi
              exit "$fail"

         - name: Compute native addon cache key
           id: natives-key
           shell: bash
           env:
              # Must equal the hashFiles() list of the `natives-key` step in
              # upstream ci.yml (workflow expressions cannot be read from a
              # variable, so this is a literal copy).
              NATIVE_INPUTS_HASH: ${{ hashFiles('Cargo.toml', 'Cargo.lock', 'MODULE.bazel', 'MODULE.bazel.lock', 'rust-toolchain.toml', 'rustfmt.toml', '.bazelrc', '.bazelignore', '.bazelversion', 'bazel/**', 'crates/**', 'BUILD.bazel') }}
           run: |
              set -euo pipefail
              if [ -z "$NATIVE_INPUTS_HASH" ]; then
                echo "::error::No native inputs found in the checkout."
                exit 1
              fi
              echo "key=$NATIVES_KEY_PREFIX$NATIVE_INPUTS_HASH" >> "$GITHUB_OUTPUT"

         # Same path spelling (`ci-natives`) and action pin as the PR restore
         # step in ci.yml. The cache version hashes the path list, the
         # compression method and the cross-OS flag; this job and the PR
         # restore both run on GitHub-hosted ubuntu-22.04, so all three match.
         - name: Probe native addon cache entry
           id: probe
           if: github.event_name != 'pull_request'
           uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
           with:
              path: ci-natives
              key: ${{ steps.natives-key.outputs.key }}
              lookup-only: true

         - name: Report cache state
           shell: bash
           env:
              HIT: ${{ steps.probe.outputs.cache-hit }}
              KEY: ${{ steps.natives-key.outputs.key }}
              RUN_ID: ${{ needs.find.outputs.run-id }}
           run: |
              if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
                echo "::notice title=Native addon cache::Validation run; cache not probed. Copying $UPSTREAM_REPO run $RUN_ID as $KEY without saving."
              elif [ "$HIT" = true ]; then
                echo "::notice title=Native addon cache::$KEY is already cached on main; nothing to copy."
              elif [ "$GITHUB_REF" != refs/heads/main ]; then
                echo "::notice title=Native addon cache::Not on main; copying $UPSTREAM_REPO run $RUN_ID as $KEY without saving."
              else
                echo "::notice title=Native addon cache::Copying $UPSTREAM_REPO run $RUN_ID into the cache as $KEY."
              fi

         # Upload layout: natives-linux-x64-{baseline,modern}/<addon>.node,
         # which is the `ci-natives` layout ci.yml restores.
         - name: Download upstream native addon artifact
           if: steps.probe.outputs.cache-hit != 'true'
           uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
           with:
              name: ${{ env.ARTIFACT_NAME }}
              path: ci-natives
              repository: ${{ env.UPSTREAM_REPO }}
              run-id: ${{ needs.find.outputs.run-id }}
              github-token: ${{ github.token }}

         # A corrupt download must fail here, not as a dlopen error in every PR.
         - name: Smoke native addons
           if: steps.probe.outputs.cache-hit != 'true'
           shell: bash
           run: |
              set -euo pipefail
              ls -l ci-natives/*/
              cat > "$RUNNER_TEMP/smoke-addons.js" <<'EOF'
              for (const f of process.argv.slice(2)) {
               const m = require(f);
               if (!m || Object.keys(m).length === 0) {
               	console.error(`addon failed to load: ${f}`);
               	process.exit(1);
               }
               console.log(`${f}: ${Object.keys(m).length} exports`);
              }
              EOF
              node "$RUNNER_TEMP/smoke-addons.js" \
                "$PWD/ci-natives/natives-linux-x64-baseline/pi_natives.linux-x64-baseline.node" \
                "$PWD/ci-natives/natives-linux-x64-modern/pi_natives.linux-x64-modern.node"

         - name: Save native addon cache entry
           id: save
           if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.probe.outputs.cache-hit != 'true'
           uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
           with:
              path: ci-natives
              key: ${{ steps.natives-key.outputs.key }}

   # Separate job so only this step holds `actions: write`. Keeps the newest
   # two entries, as upstream does (the artifact is about 124 MB). Deletion is
   # best-effort: GitHub may already have evicted an entry.
   prune:
      name: Prune superseded native addon cache entries
      needs: seed
      if: needs.seed.outputs.saved == 'true'
      runs-on: ubuntu-22.04
      timeout-minutes: 10
      permissions:
         actions: write
      steps:
         - name: Delete all but the newest two entries
           shell: bash
           env:
              GH_TOKEN: ${{ github.token }}
           run: |
              set -euo pipefail
              gh cache list --repo "$GITHUB_REPOSITORY" --ref refs/heads/main --key "$NATIVES_KEY_PREFIX" \
                  --sort created_at --order desc --limit 100 --json id --jq '.[2:][].id' \
                | while read -r id; do
                    gh cache delete "$id" --repo "$GITHUB_REPOSITORY" || echo "::warning::Could not delete cache entry $id."
                  done
