# Fork-only: seed the main-built native addon cache that PR CI restores.
#
# Upstream CI (ci.yml, job `native_addons`) never builds the native addons on
# pull requests. A PR restores the linux-x64 addon pair that a `main` push run
# saved to actions/cache under `natives-linux-x64-v1-<hash of native inputs>`,
# and without any entry it falls back to the latest npm release. In upstream
# that `main` build runs on `vmon-large/from=omp-ci` self-hosted runners. This
# fork has no vmon runner, so `main` never saves an entry and every fork PR
# tests against the npm release addons. PRs that depend on merged but
# unreleased native code (for example `renderHtml`) then fail.
#
# This workflow builds the same pair on a GitHub-hosted runner (free for this
# public fork) and saves it under the same key on `refs/heads/main`, so PRs
# that target `main` restore it. By default it builds upstream `main`
# (can1357/oh-my-pi), because fork branches start from upstream `main`.
# Dispatch with `repository`/`ref` inputs to build another commit, for example
# this fork's `main` after a sync.
#
# Keep the key in step with upstream ci.yml: the `Check upstream cache key`
# step fails when ci.yml no longer defines the key this workflow writes.
name: Fork native addon cache

on:
   schedule:
      # Every 6 hours. A run that finds the exact key already cached exits
      # after the probe, so idle runs take about a minute.
      - cron: "17 */6 * * *"
   workflow_dispatch:
      inputs:
         repository:
            description: "Repository to build (owner/name)"
            type: string
            default: can1357/oh-my-pi
         ref:
            description: "Branch, tag or commit SHA to build"
            type: string
            default: main
   push:
      branches: [main]
      paths:
         - ".github/workflows/fork-natives.yml"
   # Validation only: builds and smoke-tests, never saves (an entry saved on a
   # PR ref is readable by that ref alone).
   pull_request:
      branches: [main]
      paths:
         - ".github/workflows/fork-natives.yml"

permissions:
   contents: read

concurrency:
   group: fork-natives-${{ github.ref }}
   cancel-in-progress: false

env:
   NATIVES_X64_TARGETS: natives-linux-x64-baseline natives-linux-x64-modern
   # Must equal the prefix and hashFiles() list of the `natives-key` step in
   # upstream ci.yml; the drift check below compares them.
   NATIVES_KEY_PREFIX: natives-linux-x64-v1-
   NATIVES_HASH_EXPR: "hashFiles('Cargo.toml', 'Cargo.lock', 'MODULE.bazel', 'MODULE.bazel.lock', 'rust-toolchain.toml', 'rustfmt.toml', '.bazelrc', '.bazelignore', '.bazelversion', 'bazel/**', 'crates/**', 'BUILD.bazel')"

jobs:
   seed:
      name: Build and cache linux-x64 native addons
      # Upstream has vmon runners and its own main build; run only in forks.
      if: github.repository_owner != 'can1357'
      runs-on: ubuntu-22.04
      timeout-minutes: 300
      permissions:
         contents: read
         # actions: write lets the prune step delete superseded entries.
         actions: write
      steps:
         - name: Check out the source to build
           uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
           with:
              repository: ${{ inputs.repository || 'can1357/oh-my-pi' }}
              ref: ${{ inputs.ref || 'main' }}
              persist-credentials: false

         - name: Check upstream cache key definition
           shell: bash
           run: |
              set -euo pipefail
              ci=.github/workflows/ci.yml
              # Built with ${dollar} so this script holds no literal
              # expression opener for the workflow parser to evaluate.
              dollar='$'
              if ! grep -qF "NATIVE_INPUTS_HASH: ${dollar}{{ $NATIVES_HASH_EXPR }}" "$ci"; then
                echo "::error::$ci no longer hashes the native inputs this workflow expects. Update NATIVES_HASH_EXPR and the key step in fork-natives.yml."
                exit 1
              fi
              if ! grep -qF "prefix=$NATIVES_KEY_PREFIX" "$ci"; then
                echo "::error::$ci no longer uses the cache key prefix $NATIVES_KEY_PREFIX. Update NATIVES_KEY_PREFIX in fork-natives.yml."
                exit 1
              fi

         - name: Compute native addon cache key
           id: natives-key
           shell: bash
           env:
              # Literal copy of the expression in NATIVES_HASH_EXPR (workflow
              # expressions cannot be evaluated from a variable).
              NATIVE_INPUTS_HASH: ${{ hashFiles('Cargo.toml', 'Cargo.lock', 'MODULE.bazel', 'MODULE.bazel.lock', 'rust-toolchain.toml', 'rustfmt.toml', '.bazelrc', '.bazelignore', '.bazelversion', 'bazel/**', 'crates/**', 'BUILD.bazel') }}
           run: |
              set -euo pipefail
              if [ -z "$NATIVE_INPUTS_HASH" ]; then
                echo "::error::No native inputs found in the checkout; this ref predates the Bazel native build."
                exit 1
              fi
              echo "prefix=$NATIVES_KEY_PREFIX" >> "$GITHUB_OUTPUT"
              echo "key=$NATIVES_KEY_PREFIX$NATIVE_INPUTS_HASH" >> "$GITHUB_OUTPUT"
              echo "Built source: $(git rev-parse HEAD); cache key: $NATIVES_KEY_PREFIX$NATIVE_INPUTS_HASH"

         - name: Probe native addon cache entry
           id: probe
           if: github.event_name != 'pull_request'
           uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
           with:
              path: ci-natives
              key: ${{ steps.natives-key.outputs.key }}
              lookup-only: true

         - name: Report cache state
           shell: bash
           env:
              HIT: ${{ steps.probe.outputs.cache-hit }}
              KEY: ${{ steps.natives-key.outputs.key }}
           run: |
              if [ "$HIT" = true ]; then
                echo "::notice title=Native addon cache::$KEY is already cached on main; nothing to build."
              else
                echo "::notice title=Native addon cache::$KEY is not cached; building the linux-x64 pair."
              fi

         # GitHub-hosted images keep about 20 GB free; a cold Bazel build of
         # the Rust addons needs more. Drop toolchains this job never uses.
         - name: Free runner disk space
           if: steps.probe.outputs.cache-hit != 'true'
           shell: bash
           run: |
              df -h /
              sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
              df -h /

         - name: Build linux-x64 native addons
           if: steps.probe.outputs.cache-hit != 'true'
           shell: bash
           run: |
              set -eo pipefail
              if [ "$(ulimit -Sn)" != unlimited ] && [ "$(ulimit -Sn)" -lt 65536 ]; then ulimit -Sn 65536 || true; fi
              # One addon per invocation, as in upstream ci.yml: concurrent
              # cdylib links each peak at several GiB of rustc RSS and the
              # hosted runner has 16 GiB.
              : > "$RUNNER_TEMP/bazel-build.log"
              for target in $NATIVES_X64_TARGETS; do
                bazelisk build --config=ci "//:$target" 2>&1 | tee -a "$RUNNER_TEMP/bazel-build.log"
              done
              for target in $NATIVES_X64_TARGETS; do
                mkdir -p "ci-natives/$target"
                cp -L bazel-bin/"$target"/*.node "ci-natives/$target/"
              done
              ls -l ci-natives/*/

         # A corrupt build must fail here, not as a dlopen error in every PR.
         - name: Smoke native addons
           if: steps.probe.outputs.cache-hit != 'true'
           shell: bash
           run: |
              set -euo pipefail
              cat > "$RUNNER_TEMP/smoke-addons.js" <<'EOF'
              for (const f of process.argv.slice(2)) {
               const m = require(f);
               if (!m || Object.keys(m).length === 0) {
               	console.error(`addon failed to load: ${f}`);
               	process.exit(1);
               }
               console.log(`${f}: ${Object.keys(m).length} exports`);
              }
              EOF
              node "$RUNNER_TEMP/smoke-addons.js" \
                "$PWD/ci-natives/natives-linux-x64-baseline/pi_natives.linux-x64-baseline.node" \
                "$PWD/ci-natives/natives-linux-x64-modern/pi_natives.linux-x64-modern.node"

         # Same path spelling (`ci-natives`) and action version as the PR
         # restore step in ci.yml: the cache version hashes the path list.
         - name: Save native addon cache entry
           if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.probe.outputs.cache-hit != 'true'
           uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
           with:
              path: ci-natives
              key: ${{ steps.natives-key.outputs.key }}

         # Keep the newest three entries (~150 MB) so PRs on slightly older
         # upstream commits can still hit an exact key.
         - name: Prune superseded native addon cache entries
           if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.probe.outputs.cache-hit != 'true'
           continue-on-error: true
           shell: bash
           env:
              GH_TOKEN: ${{ github.token }}
              PREFIX: ${{ steps.natives-key.outputs.prefix }}
           run: |
              gh cache list --repo "$GITHUB_REPOSITORY" --ref refs/heads/main --key "$PREFIX" \
                  --sort created_at --order desc --limit 100 --json id --jq '.[3:][].id' \
                | while read -r id; do
                    gh cache delete "$id" --repo "$GITHUB_REPOSITORY" || true
                  done || true
